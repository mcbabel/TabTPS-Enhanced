name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version, release notes and token
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          notes="release-notes/$version.md"
          if [ ! -f "$notes" ]; then
            echo "$notes is missing, add the release notes for $version first"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists, raise the version in gradle.properties"
            exit 1
          fi
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN secret is not set"
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "NOTES_FILE=$notes"
            echo "RELEASE_NOTES<<RELEASE_NOTES_EOF"
            cat "$notes"
            echo
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew build --console=plain

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=(
            "folia/build/libs/tabtps-enhanced-$VERSION.jar"
            "forge/26.3/build/libs/tabtps-forge-mc26.3-$VERSION.jar"
            "forge/1.20.1/build/libs/tabtps-forge-mc1.20.1-$VERSION.jar"
            "velocity/build/libs/tabtps-velocity-$VERSION.jar"
          )
          for jar in "${jars[@]}"; do
            if [ ! -f "$jar" ]; then
              echo "$jar was not built"
              exit 1
            fi
          done
          gh release create "v$VERSION" "${jars[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TabTPS Enhanced v$VERSION" \
            --notes-file "$NOTES_FILE"

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishModrinth --console=plain
