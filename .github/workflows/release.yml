name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to publish
        type: choice
        default: new release
        options:
          - new release
          - existing release to Hangar
          - existing release to CurseForge
          - existing release to Hangar and CurseForge

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version, release notes and tokens
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          notes="release-notes/$version.md"
          if [ ! -f "$notes" ]; then
            echo "$notes is missing, add the release notes for $version first"
            exit 1
          fi
          tagged=false
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            tagged=true
          fi
          hangar=false
          curseforge=false
          if [ "$MODE" = "new release" ]; then
            if [ "$tagged" = true ]; then
              echo "Tag v$version already exists, raise the version in gradle.properties"
              exit 1
            fi
            if [ -z "$MODRINTH_TOKEN" ]; then
              echo "MODRINTH_TOKEN secret is not set"
              exit 1
            fi
            [ -n "$HANGAR_TOKEN" ] && hangar=true || echo "::warning::HANGAR_TOKEN secret is not set, skipping Hangar"
            [ -n "$CURSEFORGE_TOKEN" ] && curseforge=true || echo "::warning::CURSEFORGE_TOKEN secret is not set, skipping CurseForge"
          else
            if [ "$tagged" = false ]; then
              echo "There is no release v$version yet, use new release"
              exit 1
            fi
            case "$MODE" in *Hangar*) hangar=true ;; esac
            case "$MODE" in *CurseForge*) curseforge=true ;; esac
            if [ "$hangar" = true ] && [ -z "$HANGAR_TOKEN" ]; then
              echo "HANGAR_TOKEN secret is not set"
              exit 1
            fi
            if [ "$curseforge" = true ] && [ -z "$CURSEFORGE_TOKEN" ]; then
              echo "CURSEFORGE_TOKEN secret is not set"
              exit 1
            fi
          fi
          if [ "$curseforge" = true ] && [ -z "$(grep '^curseforgeProjectId=' gradle.properties | cut -d= -f2)" ]; then
            echo "curseforgeProjectId is not set in gradle.properties"
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "NOTES_FILE=$notes"
            echo "PUBLISH_HANGAR=$hangar"
            echo "PUBLISH_CURSEFORGE=$curseforge"
            echo "RELEASE_NOTES<<RELEASE_NOTES_EOF"
            cat "$notes"
            echo
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew build --console=plain

      - name: Create GitHub release
        if: env.MODE == 'new release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=(
            "folia/build/libs/tabtps-enhanced-$VERSION.jar"
            "forge/26.3/build/libs/tabtps-forge-mc26.3-$VERSION.jar"
            "forge/1.20.1/build/libs/tabtps-forge-mc1.20.1-$VERSION.jar"
            "velocity/build/libs/tabtps-velocity-$VERSION.jar"
          )
          for jar in "${jars[@]}"; do
            if [ ! -f "$jar" ]; then
              echo "$jar was not built"
              exit 1
            fi
          done
          gh release create "v$VERSION" "${jars[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TabTPS Enhanced v$VERSION" \
            --notes-file "$NOTES_FILE"

      - name: Publish to Modrinth
        if: env.MODE == 'new release'
        env:
          PUBLISH: "true"
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishModrinth --console=plain

      - name: Publish to Hangar
        if: env.PUBLISH_HANGAR == 'true'
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
        run: ./gradlew :tabtps-folia:publishPluginPublicationToHangar --console=plain

      - name: Publish to CurseForge
        if: env.PUBLISH_CURSEFORGE == 'true'
        env:
          PUBLISH: "true"
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew publishCurseforge --console=plain
